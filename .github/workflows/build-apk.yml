name: Compilar APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests
        run: ./gradlew testDebugUnitTest --tests '*NutritionPlanTest*' --tests '*ClaudeAnalyzerTest*' --tests '*GeminiAnalyzerTest*'

      - name: Compilar APK
        run: ./gradlew assembleRelease

      - name: Renombrar APK
        run: cp app/build/outputs/apk/release/app-release.apk NutriScan.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NutriScan-apk
          path: NutriScan.apk

      # En cada cambio en main, publica el APK en la release "latest"
      # para poder descargarlo directamente desde el móvil.
      - name: Publicar release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: NutriScan (última versión)
          prerelease: false
          make_latest: true
          files: NutriScan.apk
          body: |
            Descarga **NutriScan.apk** desde el móvil Android e instálalo.
            Compilado desde ${{ github.sha }}.
